name: release

# A tag `vX.Y.Z` builds the archives and publishes a GitHub release.
# A manual run (workflow_dispatch) is a dry run: it runs every job but publish, so
# it builds, checks and sums the archives and keeps them as workflow artifacts.
# The publish job, the only one that can write, is skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per tag or branch at a time; a release run is never cancelled half way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.89.0

jobs:
  # The one place the version is read. On a tag it must be `v` + the version in
  # Cargo.toml, CHANGELOG.md must have a section for it, and the tagged commit
  # must be on the default branch, so a wrong tag fails here and not after four
  # builds. A manual run reports the same problems as warnings.
  meta:
    name: version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history, for the branch check below. Only this job needs it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version and check the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p;}' Cargo.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]] \
            || { echo "::error::cannot read a version from Cargo.toml (got '$version')"; exit 1; }
          level=warning
          if [[ "$REF_TYPE" == tag ]]; then level=error; fi
          failed=0
          problem() { echo "::$level::$*"; if [[ "$level" == error ]]; then failed=1; fi; }
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            problem "tag $REF_NAME does not match Cargo.toml version $version (expected v$version)"
          fi
          .github/scripts/release-notes.sh "$version" > /dev/null \
            || problem "CHANGELOG.md has no section for version $version"
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" \
            || problem "commit $GITHUB_SHA is not on $DEFAULT_BRANCH"
          [[ "$failed" -eq 0 ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # macos-latest is Apple silicon: the Intel build runs on an Intel runner.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET" --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      # sharkline has no C dependency today, so rustc only needs the musl runtime
      # it bundles. musl-gcc is set as the C compiler below anyway, so a C
      # dependency added later is built against musl too.
      - name: Install musl-tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          cargo build --release --locked --target "$TARGET"

      # package.sh also refuses a binary that is not built for $TARGET.
      - name: Package
        run: .github/scripts/package.sh "$TARGET" "$VERSION"

      # Unpack the archive as a user would, and render the repository's sample
      # payload with the unpacked binary. HOME and the cache are a scratch
      # directory, so nothing here reads or writes a real one.
      - name: Smoke test the archive
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf "target/dist/sharkline-${VERSION}-${TARGET}.tar.gz" -C "$tmp"
          dir="$tmp/sharkline-${VERSION}-${TARGET}"
          ls -l "$dir"
          file "$dir/sharkline"
          out="$(HOME="$tmp/home" XDG_CACHE_HOME="$tmp/cache" NO_COLOR=1 SHARKLINE_NOW=1750000000 \
            "$dir/sharkline" < tests/fixtures/stdin.json)"
          echo "$out"
          [[ "$out" == *"Model: Opus 5.5"* ]]
          # --version answers without reading stdin, so it gets none.
          ver="$("$dir/sharkline" --version < /dev/null)"
          echo "$ver"
          [[ "$ver" == "sharkline $VERSION" ]]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: target/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Gathers the four archives into one set and checks they are the right four.
  # It runs on a manual run too, so a dry run covers everything except the
  # release itself. Read-only: this job has no token that can write.
  assemble:
    name: assemble release files
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      # No merging: each artifact lands in its own directory, in/archive-TARGET.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: in

      # archive-TARGET must hold exactly sharkline-VERSION-TARGET.tar.gz, so each
      # archive is tied to the build job of its own target.
      - name: Check each archive and write SHA256SUMS
        run: |
          set -euo pipefail
          targets=(aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl)
          found="$(cd in && find . -mindepth 1 -maxdepth 1 | sort | tr '\n' ' ')"
          expected="$(printf './archive-%s\n' "${targets[@]}" | sort | tr '\n' ' ')"
          [[ "$found" == "$expected" ]] \
            || { echo "::error::expected the artifacts $expected but found $found"; exit 1; }
          mkdir dist
          for t in "${targets[@]}"; do
            name="sharkline-${VERSION}-${t}.tar.gz"
            files="$(cd "in/archive-$t" && find . -mindepth 1 | sort | tr '\n' ' ')"
            [[ "$files" == "./$name " && -f "in/archive-$t/$name" && ! -L "in/archive-$t/$name" ]] \
              || { echo "::error::archive-$t must hold only the regular file $name, found: $files"; exit 1; }
            mv "in/archive-$t/$name" dist/
          done
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [meta, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write: it creates the release and signs the provenance.
    permissions:
      contents: write # create the release and upload the assets
      id-token: write # Sigstore identity that signs the attestation
      attestations: write # store the attestation
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Check the files
        working-directory: dist
        run: |
          set -euo pipefail
          : "${VERSION:?}"
          targets=(aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl)
          archives=()
          for t in "${targets[@]}"; do archives+=("sharkline-$VERSION-$t.tar.gz"); done
          found="$(find . -mindepth 1 | sort | tr '\n' ' ')"
          expected="$(printf './%s\n' "${archives[@]}" SHA256SUMS | sort | tr '\n' ' ')"
          [[ "$found" == "$expected" && -z "$(find . -mindepth 1 ! -type f)" ]] \
            || { echo "::error::expected the regular files $expected but found $found"; exit 1; }
          summed="$(awk '{print $2}' SHA256SUMS | sort | tr '\n' ' ')"
          [[ "$summed" == "$(printf '%s\n' "${archives[@]}" | sort | tr '\n' ' ')" ]] \
            || { echo "::error::SHA256SUMS must list each archive once, found: $summed"; exit 1; }
          sha256sum --strict -c SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          .github/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=()
          # Build metadata (1.0.0+build-5) is not a pre-release marker; a hyphen before it is.
          if [[ "${VERSION%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          # `--verify-tag` only checks that the tag exists. A tag moved while this
          # run was building would publish these archives under a tag that no
          # longer points at the commit they were built from, so check it here,
          # as close to the release as the API allows.
          now="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)"
          [[ "$now" == "$GITHUB_SHA" ]] \
            || { echo "::error::tag $TAG now points at $now, but this run built $GITHUB_SHA"; exit 1; }
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            ${flags[@]+"${flags[@]}"} dist/*.tar.gz dist/SHA256SUMS
